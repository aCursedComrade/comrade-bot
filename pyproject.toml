[tool.poetry]
authors = ["Loshana Aloka <acursed_comrade@proton.me>"]
description = "Simple Discord bot"
name = "comrade-bot"
package-mode = false
readme = "README.md"
version = "1.0.0"

[tool.poetry.dependencies]
discord-py = "2.5.2"
feedparser = "6.0.11"
pymongo = "4.13"
python = "^3.11"
requests = "^2.32"

[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.0.1"

[tool.pyright]
exclude = ["**/__pycache__/"]
include = ["comrade-bot/"]
venv = ".venv/"
venvPath = "/"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
